[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-pytorch"
version = "1.0.1"
description = "Federated Learning with PyTorch and Flower (Quickstart Example)"
license = "Apache-2.0"
dependencies = [
    "flwr>=1.27.0",
    "ray==2.51.1",
    "flwr-datasets[vision]>=0.5.0",
    "torch==2.9.0",
    "torchvision==0.24.0",
]

[tool.hatch.build]
only-packages = true
exclude = [
  ".venv",
  ".venv/**",
  "__pycache__",
  "__pycache__/**",
  "dist",
  "dist/**",
  "build",
  "build/**",
  "*.pt",
]

[tool.hatch.build.targets.wheel]
packages = ["pytorchexample"]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "pytorchexample.server_app:app"
clientapp = "pytorchexample.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 40
fraction-train = 0.6
fraction-evaluate = 1.0
local-epochs = 2
learning-rate = 0.01
batch-size = 64
attack-mode = 0
target-label = 0
poison-fraction = 0.12
trigger-size = 3
scale-factor = 2.5
num-malicious-nodes = 2
active-malicious-nodes-per-round = 1
metrics-csv = ""


#######################################################################
# CONFIGURATION MIGRATION NOTICE:
#
# What was previously called "federation config" for SuperLink
# connections in pyproject.toml has been renamed and moved.
#
# These settings are now **SuperLink connection configuration**
# and are defined in the Flower configuration file.
#
# The entries below are commented out intentionally and are kept
# only as a migration reference.
#
# Docs: https://flower.ai/docs/framework/ref-flower-configuration.html
