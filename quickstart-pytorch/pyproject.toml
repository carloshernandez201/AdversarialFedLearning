[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-pytorch"
version = "1.0.1"
description = "Federated Learning with PyTorch and Flower (Quickstart Example)"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.26.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch==2.6.0",
    "torchvision==0.24.0",
    "numpy",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "pytorchexample.server_app:app"
clientapp = "pytorchexample.client_app:app"

[tool.flwr.app.config]
# --- Training ---
local-epochs = 1
learning-rate = 0.01
batch-size = 32

# --- Attack ---
# 0 = no attack, 1 = model replacement, 2 = rotating malicious, 3 = constrain & scale
attack-mode = 1
target-label = 0
poison-fraction = 0.3
trigger-size = 3
scale-factor = 10.0
defense-strategy = 1
num-server-rounds = 2
fraction-train = 0.3
fraction-evaluate = 0.3
num-malicious-nodes = 1
active-malicious-nodes-per-round = 1
# --- Defense ---
# 0 = plain FedAvg, 1 = FoolsGold
